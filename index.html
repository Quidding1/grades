<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matu">
<meta name="theme-color" content="#000000" id="themeColor">
<title>Matu</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --surface:#111; --sunk:#1C1C1E; --raise:#2C2C2E; --ink:#F2F2F2; --muted:#8A8A8E; --faint:#4A4A4E; --line:#222224;
  --red:#FF453A; --amber:#FFD60A; --green:#32D74B;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --onink:#000; --te:#FF3B30;
  --r:16px; color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
:root[data-theme="light"]{--bg:#F2F2F7;--surface:#FFFFFF;--sunk:#E9E9EF;--raise:#D6D6DD;--ink:#111214;--muted:#6C6C72;--faint:#A8A8B0;--line:#E2E2E8;--red:#E0342A;--amber:#B7791F;--green:#1E9E4A;--onink:#fff;color-scheme:light}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F2F2F7;--surface:#FFFFFF;--sunk:#E9E9EF;--raise:#D6D6DD;--ink:#111214;--muted:#6C6C72;--faint:#A8A8B0;--line:#E2E2E8;--red:#E0342A;--amber:#B7791F;--green:#1E9E4A;--onink:#fff;color-scheme:light}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
input{outline:none}
input:focus{box-shadow:0 0 0 2px var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:10px 16px calc(150px + env(safe-area-inset-bottom,0px));overflow-x:clip}

.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;margin:0}
.icon{width:42px;height:42px;border:0;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.icon svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--surface);border-radius:var(--r);padding:16px}
.hero{padding:20px 18px 18px}
.hero .lab{font-size:14px;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:96px;line-height:.95;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.break{font-size:14px;color:var(--muted)}
.scale{position:relative;height:6px;border-radius:3px;background:var(--sunk);margin:18px 0 6px}
.scale .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.scale .pass{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.hero{position:relative}
.scaleL{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);height:16px}
.checks{display:flex;flex-direction:column;gap:4px;font-size:14px;margin-top:14px}

h2{font-size:15px;font-weight:600;color:var(--muted);margin:24px 2px 8px;display:flex;justify-content:space-between}
h2 small{font-weight:500;color:var(--faint)}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{width:100%;border:0;background:none;display:flex;align-items:center;gap:12px;padding:13px 16px;text-align:left}
.row+.row{box-shadow:inset 0 1px 0 var(--line)}
.row:active{background:var(--sunk)}
.rname{flex:1;min-width:0}
.rname b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname span{font-size:13px;color:var(--muted)}
.rval{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;text-align:right;min-width:52px}
.rval small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);margin-top:-2px}
.rval.none{color:var(--faint);font-size:20px}
.lock{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
.bonusline{display:flex;justify-content:space-between;padding:12px 16px;box-shadow:inset 0 1px 0 var(--line);font-size:14px;color:var(--muted)}
.bonusline b{color:var(--green);font-family:var(--display);font-size:20px}

.fab{position:fixed;right:max(16px, calc((100vw - 540px) / 2 + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;line-height:1;padding-bottom:3px;background:var(--ink);color:var(--onink);font-weight:700;font-size:17px;z-index:4;box-shadow:0 8px 30px rgba(0,0,0,.35)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:2;transform:translateZ(0)}
.tabsin{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;height:60px;position:relative}
.navind{position:absolute;top:0;left:0;width:33.333%;height:3px;display:flex;justify-content:center;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.navind::after{content:"";width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.navbtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--faint)}
.navbtn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn[aria-current="page"]{color:var(--ink)}
/* schedule */
.dseg{position:relative;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-radius:14px;padding:4px;margin-bottom:16px}
.dseg button{position:relative;z-index:1;border:0;background:none;height:38px;border-radius:10px;font-weight:500;color:var(--muted)}
.dseg button[aria-selected="true"]{color:var(--ink);font-weight:600}
.dseg button i{position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--green)}
.dind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 5);border-radius:10px;background:var(--sunk);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.dhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.dname{font-family:var(--display);font-weight:700;font-size:34px;margin:0;color:var(--ink)}
.nowc{background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 3px 0 0 var(--green)}
.nowc .lab{font-size:13px;color:var(--green);font-weight:600}
.nowc b{font-size:20px}
.nowc span{font-size:14px;color:var(--muted)}
.nowc.done{box-shadow:none}
.nbar{height:4px;border-radius:2px;background:var(--sunk);margin-top:10px;overflow:hidden}
.nbar i{display:block;height:100%;background:var(--green)}
.lessons{display:flex;flex-direction:column;gap:6px}
.les{display:grid;grid-template-columns:48px 4px 1fr;gap:12px;align-items:center;width:100%;border:0;background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left}
.les:active{background:var(--sunk)}
.les.past{opacity:.45}
.les.live{box-shadow:0 0 0 1.5px var(--green)}
.lt{display:flex;flex-direction:column;font-family:var(--display);line-height:1.15}
.lt b{font-size:18px} .lt span{font-size:14px;color:var(--muted)}
.lbar{width:4px;align-self:stretch;border-radius:2px}
.lc{min-width:0;display:flex;flex-direction:column}
.lc b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc span{font-size:13px;color:var(--muted)}
.free{font-size:13px;color:var(--faint);text-align:center;padding:6px 0}
.empty2{text-align:center;padding:28px 20px}
.dseg button{height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.dseg button small{font-size:11px;font-weight:500;color:var(--faint)}
.dseg button[aria-selected="true"] small{color:var(--muted)}
.dseg button i{bottom:3px}
.wk{display:flex;align-items:center;gap:8px;margin:-6px 0 10px}
.wk span{flex:1;text-align:center;font-size:14px;color:var(--muted)}
.wk .icon{width:36px;height:36px}
.wk .today{border:0;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.testc{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:6px;text-align:left;box-shadow:inset 4px 0 0 #F2A3C2}
.testc .tl{font-size:12px;font-weight:700;color:#F2A3C2;text-transform:none}
.testc .rname b{font-size:16px}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:14px 0 6px}
.stepper b{font-family:var(--display);font-weight:700;font-size:60px;min-width:130px;text-align:center;font-variant-numeric:tabular-nums}
.stp{width:60px;height:60px;border-radius:50%;border:0;background:var(--sunk);font-size:30px;font-weight:600;line-height:1}
.stp:disabled{opacity:.3}
.tpill{display:inline-block;font-size:11px;font-weight:800;background:var(--te);color:#fff;border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:2px;letter-spacing:.03em}
.lesbox{position:relative}
.lesbox .les{padding-right:54px}
.lchev{position:absolute;right:4px;top:0;width:48px;height:64px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.lchev svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.lesbox.open .lchev svg{transform:rotate(180deg)}
.ldrop{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s cubic-bezier(.2,.8,.2,1)}
.lesbox.open .ldrop{grid-template-rows:1fr}
.ldrop>div{overflow:hidden;min-height:0}
.lesbox{background:var(--surface);border-radius:14px}
.lesbox .les{background:transparent}
.lesbox.open .les{border-radius:14px 14px 0 0}
.ldrop>div{padding:0 8px}
.lesbox.open .ldrop>div{padding:0 8px 8px}
.ldrop .tcard{margin:0 0 6px;width:100%;background:var(--sunk);min-height:56px}
.ldrop .tcard:last-child{margin-bottom:0}
.ldrop .testc .tl{color:var(--red)}
input[type=date].inp{color-scheme:inherit}
/* test and homework cards */
.tcard{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;border:0;background:var(--surface);border-radius:14px;padding:8px 12px 8px 8px;margin-bottom:6px;text-align:left}
button.tcard:active{background:var(--sunk)}
.dchip{flex:none;width:44px;height:44px;border-radius:11px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dchip b{font-family:var(--display);font-weight:700;font-size:20px}
.dchip small{font-size:10px;color:var(--muted);margin-top:3px}
.dchip.te{background:var(--te);color:#fff}
.tcx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.tcx b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcx span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.tcx{border:0;background:none;padding:6px 0;text-align:left;align-self:stretch}
.kind{flex:none;font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 7px;border-radius:6px;background:var(--te);color:#fff}
.kind.dv{background:#FFCC00;color:#000}
.hwck{flex:none;width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;padding:0}
.hwck i{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:transparent;transition:all .15s}
.hwck[aria-checked="true"] i{background:var(--green);border-color:var(--green);color:#fff}
.tcard.done .tcx b{text-decoration:line-through;color:var(--muted)}
.lc .tpill{flex:none;font-size:11px;color:#fff;margin-left:6px}
.tpill.dv{background:#FFCC00}
.lc .tpill.dv{color:#000}
.lc .lname{display:flex;align-items:center;min-width:0}
.lc .lname .ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-size:inherit;color:inherit}
/* holidays */
.cdwrap{display:flex;justify-content:center;margin:0 0 12px}
.cdown{font-size:13px;font-weight:500;color:var(--muted);background:var(--surface);border-radius:999px;padding:6px 14px}
.holc{background:var(--surface);border-radius:var(--r);padding:28px 18px;text-align:center}
.holc b{display:block;font-family:var(--display);font-weight:700;font-size:30px;margin-bottom:4px}
.holc span{color:var(--muted)}
.dseg button.hol{opacity:.4}
/* agenda */
.agh{font-size:14px;font-weight:600;color:var(--muted);margin:18px 2px 8px}
.agh.late{color:var(--red)}
/* trend */
.trend{margin-top:4px}
.tut{position:fixed;inset:0;z-index:7;display:none}
.tut.on{display:block}
.tuthole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.72);transition:all .32s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tutbox{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:18px;padding:16px 18px 14px;box-shadow:0 12px 40px rgba(0,0,0,.45);transition:top .32s cubic-bezier(.2,.8,.2,1)}
.tutbox b{display:block;font-family:var(--display);font-weight:700;font-size:24px;margin-bottom:4px}
.tutbox p{margin:0 0 12px;color:var(--muted);font-size:15px}
.tutfoot{display:flex;align-items:center;gap:10px}
.tutdots{flex:1;display:flex;gap:5px}
.tutdots i{width:6px;height:6px;border-radius:50%;background:var(--raise)}
.tutdots i.on{background:var(--ink)}
.tutbox .mini{height:40px;padding:0 18px;border-radius:12px;background:var(--ink);color:var(--onink)}
.tutskip{border:0;background:none;color:var(--muted);font-size:14px;padding:8px}
.sbox .opt{background:var(--sunk)}
.addopt{flex-direction:row !important;align-items:center !important;gap:14px}
.opt .atx{display:flex;flex-direction:column;color:var(--ink);font-size:inherit}
.opt .atx span{font-size:13px;color:var(--muted)}
.aico{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.aico.nt{background:var(--green);color:#000;font-family:var(--display);font-size:17px}
.aico.te{background:var(--te);color:#fff}
.aico.dv{background:#FFCC00;color:#000}
.aico.cs{background:var(--raise)}
.aico.cs svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hwline{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:12px;text-align:left;font-size:15px;font-weight:500}
.hwline span:nth-child(2){flex:1}
.hwline svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:var(--surface);border-radius:var(--r);padding:14px 16px;text-align:left;min-height:84px}
.tile b{font-size:16px;font-weight:600}
.tile span{font-size:13px;color:var(--muted)}
.tile:active{background:var(--sunk)}
.trhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.trhead .lab{font-size:14px;color:var(--muted)}
.trhead b{font-family:var(--display);font-size:24px}
.trend svg{display:block;width:100%;height:100px;color:var(--ink)}
/* exams */
.exrow{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.exh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.exh b{font-weight:600}
.exh span{font-size:13px;color:var(--muted);text-align:right}
.exf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mstep{background:var(--sunk);border-radius:12px;padding:6px}
.mstep small{display:block;font-size:12px;color:var(--muted);text-align:center;margin-bottom:4px}
.mrowx{display:flex;align-items:center;justify-content:space-between}
.mrowx button{width:38px;height:38px;border:0;border-radius:10px;background:var(--surface);font-size:20px;font-weight:600}
.mrowx b{font-family:var(--display);font-size:24px;min-width:40px;text-align:center}
.mrowx b.empty{color:var(--faint)}
textarea.inp.area{height:auto;min-height:120px;padding:12px 14px;resize:vertical;line-height:1.4}
label.check{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:14px;color:var(--muted)}
label.check input{width:20px;height:20px;accent-color:#32D74B}
.empty2 b{font-size:18px} .empty2 p{color:var(--muted);margin:6px 0 4px}
/* onboarding */
.ob{position:fixed;inset:0;background:var(--bg);z-index:8;display:none}
.ob.on{display:block}
.obin{max-width:540px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px))}
.obtop{display:flex;align-items:center;gap:12px;height:48px;flex:none}
.obprog{flex:1;height:4px;border-radius:2px;background:var(--surface);overflow:hidden}
.obprog i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.obslide{flex:1;overflow-y:auto;padding:18px 0 10px}
.obslide h2{font-family:var(--display);font-weight:700;font-size:36px;line-height:1.05;color:var(--ink);margin:0 0 8px;display:block}
.obslide p{color:var(--muted);margin:0 0 18px}
.obhero{font-size:56px;margin:30px 0 10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:var(--surface);border-radius:16px;padding:16px 18px;margin-bottom:8px;text-align:left;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s,background .15s}
.opt b{font-size:17px;font-weight:600}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);background:var(--sunk)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt.sm{align-items:center;padding:16px 8px;margin:0}
.textlink{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font-size:15px;text-decoration:underline;text-underline-offset:3px;padding:8px}
/* fullscreen subject */
.screen{position:fixed;inset:0;background:var(--bg);z-index:3;padding-bottom:0;overflow-y:auto;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;visibility:hidden;overscroll-behavior:contain}
.screen.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sin{max-width:540px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(160px + env(safe-area-inset-bottom,0px))}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shead h1{font-size:36px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05}
.stat span{font-size:12px;color:var(--muted)}
.spark{display:block;width:100%;height:90px;color:var(--ink)}
.grow{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;border:0;background:none;text-align:left}
.grow+.grow{box-shadow:inset 0 1px 0 var(--line)}
.grow:active{background:var(--sunk)}
.gbadge{font-family:var(--display);font-weight:700;font-size:24px;min-width:46px;font-variant-numeric:tabular-nums}
.gw{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:2px 8px}
.need{display:flex;flex-direction:column;gap:12px}
.needres{font-size:15px}
.needres b{font-family:var(--display);font-size:28px}

/* inputs + chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--sunk);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--onink)}
.lab2{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.inp{width:100%;height:46px;border:0;background:var(--sunk);border-radius:12px;padding:0 14px}
.gradein{width:100%;height:84px;border:0;background:var(--sunk);border-radius:18px;text-align:center;font-family:var(--display);font-weight:700;font-size:56px}
.gradein::placeholder{color:var(--faint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;height:54px;border:0;border-radius:var(--r);background:var(--ink);color:var(--onink);font-weight:700;font-size:17px;margin-top:18px}
.secondary{width:100%;height:48px;border:0;border-radius:14px;background:var(--sunk);font-weight:600;font-size:15px;margin-top:8px}
.danger{color:var(--red)}
.switch{width:50px;height:30px;padding:0;border-radius:999px;border:0;background:var(--raise);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{left:calc(100% - 27px)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0}
.setting+.setting{box-shadow:inset 0 1px 0 var(--line)}
.setting p{margin:0}
.setting small{display:block;color:var(--muted);font-size:13px}
.num{width:80px;height:40px;border:0;background:var(--sunk);border-radius:10px;text-align:center;font-family:var(--display);font-weight:700;font-size:20px}
.mrow{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:center;margin-bottom:8px}
.mrow .inp{height:42px}
.mini{border:0;background:var(--sunk);border-radius:10px;height:42px;padding:0 12px;font-size:14px;font-weight:600}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:5;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .25s}
.sheet.on{opacity:1;visibility:visible;transition:opacity .2s}
.sbox{background:var(--surface);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on .sbox{transform:none}
.sbox::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--raise);margin:0 auto 14px}
.sbox h3{font-family:var(--display);font-weight:700;font-size:30px;margin:0 0 4px}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--onink);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:500;display:none;z-index:9;max-width:90vw;text-align:center}
.toast.on{display:block}
.tact{background:none;border:0;font-weight:700;text-decoration:underline;color:inherit;margin-left:10px;padding:0}
.c-red{color:var(--red)} .c-amber{color:var(--amber)} .c-green{color:var(--green)}
.chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#setScreen .opt{background:var(--surface)}
#setScreen .opt[aria-pressed="true"]{background:var(--sunk)}
/* v1.17 */
.fab{font-size:0;padding:0}
.fab svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.nowc{background:color-mix(in srgb,var(--green) 12%,var(--surface));box-shadow:none;border-radius:18px;padding:14px 16px 16px}
.nowc .lab{display:flex;align-items:center;gap:7px}
.nowc .lab::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite}
.nowc.next{background:var(--surface)}
.nowc.next .lab{color:var(--ink)}
.nowc.next .lab::before{background:var(--muted);animation:none}
.nowc.done{background:var(--surface)}
.nowc.done .lab::before{display:none}
.nbar{background:color-mix(in srgb,var(--green) 22%,transparent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.les{position:relative;overflow:hidden}
.les.live{box-shadow:none;background:color-mix(in srgb,var(--green) 13%,var(--surface))}
.les.live .lt b{color:var(--green)}
.lesbox.live{background:color-mix(in srgb,var(--green) 13%,var(--surface))}
.lesbox.live .les{background:transparent}
.lprog{position:absolute;left:0;bottom:0;height:3px;background:var(--green);border-radius:0 2px 2px 0}
.livetag{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#000;background:var(--green);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.lesbox{overflow:hidden}
.lesbox.open .ldrop>div{padding:8px 8px 8px}
/* settings rows: one frame per item */
.srow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--surface);border-radius:16px;padding:13px 14px 13px 12px;margin-bottom:8px;text-align:left}
button.srow:active{background:var(--sunk)}
.srow .rname b{white-space:normal}
.srow .rname>span{display:block;line-height:1.35;margin-top:1px}
.srow.danger b{color:var(--red)}
.srow.static{cursor:default}
.sico{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
:root[data-theme="light"] .sico{color:color-mix(in srgb,var(--c) 55%,#000)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .sico{color:color-mix(in srgb,var(--c) 55%,#000)}}
.sico svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scard{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:8px}
.scard>b{display:block;font-weight:600}
.scard>span{display:block;font-size:13px;color:var(--muted);line-height:1.35}
/* semesters */
.seg3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:12px;padding:3px;margin-bottom:8px}
.seg3 button{border:0;background:none;height:34px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg3 button[aria-selected="true"]{background:var(--sunk);color:var(--ink);font-weight:600}
.semrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.semc{background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.semc span{font-size:12px;color:var(--muted)}
.semc b{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1}

.semc.cur{box-shadow:inset 0 0 0 1.5px var(--raise)}
/* combined grades */
.mixrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mixrow .mixg{width:70px;flex:none;text-align:center;font-family:var(--display);font-weight:700;font-size:22px}
.mixrow .chips{flex:1;flex-wrap:nowrap;overflow-x:auto;gap:4px}
.mixrow .chip{padding:8px 10px}
.mixrow .mini{flex:none;width:38px;padding:0}
.mixfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mixtot{font-size:15px;text-align:right}
.mixtot b{font-family:var(--display);font-size:26px}
.mixtot small{display:block;font-size:12px;color:var(--muted)}
.mixline{display:block;font-size:12px;color:var(--faint)}
/* past tests */
.agh{display:flex;justify-content:space-between;align-items:baseline}
.agh small{font-size:13px;font-weight:600;color:var(--amber)}
.addnote{flex:none;border:0;border-radius:999px;background:var(--green);color:#000;font-size:13px;font-weight:700;padding:8px 12px}
.gdone{flex:none;border:0;background:var(--sunk);border-radius:11px;min-width:48px;height:40px;font-family:var(--display);font-weight:700;font-size:22px}
/* offline */
.offbar{display:none;align-items:center;gap:10px;width:100%;border:0;background:var(--surface);border-radius:14px;padding:10px 14px;margin:0 0 12px;text-align:left;font-size:14px}
.offbar.on{display:flex}
.offbar svg,.offhero svg{stroke:var(--amber);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.offbar svg{width:20px;height:20px;flex:none}
.offbar b{font-weight:600}
.offbar span{color:var(--muted);flex:1}
.offhero{display:flex;justify-content:center;margin:8px 0 6px}
.offhero svg{width:64px;height:64px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ============ data ============ */
const KEY = "grades-v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const SUBJECTS = ["Français","Allemand","Anglais","Mathématiques","Biologie","Histoire","Géographie","Philosophie","Option spécifique","Option complémentaire"];
const PP_PARTS = [{key:"philo", name:"Philosophie", share:3}, {key:"psycho", name:"Psychologie", share:2}];
function defaults(){
  return {v:1,
    subjects: SUBJECTS.map(n => ({id:uid(), name:n, counts:true, grades:[]})),
    tm:{g:null},
    locked:[], lockedPoints:null, lockMig:true, ppMig:true, abMig:true,
    settings:{bonus:0.5, round:true, lastSub:null, lastW:1}};
}
function migrate(st){
  // One-time upgrade from the very first version, where Philosophie and Psychologie were two separate subjects.
  if(st.ppMig) return st;
  st.ppMig = true;
  // Repair: an earlier update could wrongly turn the Philosophie discipline into "Philo & Psycho"
  // for students whose option spécifique isn't philo-psycho.
  const osAns = st.tt && st.tt.ans && st.tt.ans.os;
  const combo0 = st.subjects.find(x => x.parts && x.name === "Philo & Psycho");
  if(combo0 && osAns && !/^3MSPP/.test(osAns) && !st.subjects.some(x => /^philosophie$/i.test(x.name))){
    combo0.name = "Philosophie"; delete combo0.parts; combo0.grades.forEach(g => delete g.part); return st;
  }
  if(st.subjects.some(x => x.parts)) return st;
  const ph = st.subjects.find(x => /^philo/i.test(x.name)), ps = st.subjects.find(x => /^psycho/i.test(x.name));
  if(!ps) return st;
  const combo = {id:uid(), name:"Philo & Psycho", counts:true, parts:PP_PARTS.map(x => ({...x})),
    grades:[...(ph ? ph.grades.map(g => ({...g, part:"philo"})) : []), ...(ps ? ps.grades.map(g => ({...g, part:"psycho"})) : [])].sort((a,b) => a.date < b.date ? -1 : 1)};
  const at = st.subjects.indexOf(ph || ps);
  st.subjects = st.subjects.filter(x => x !== ph && x !== ps);
  st.subjects.splice(at, 0, combo);
  return st;
}
function dedupe(st){
  const seen = new Map(), out = [];
  st.subjects.forEach(x => {
    const k = x.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]/g, "");
    const first = seen.get(k);
    if(!first){ seen.set(k, x); out.push(x); return; }
    const ids = new Set(first.grades.map(g => g.id));
    x.grades.forEach(g => { if(!ids.has(g.id)) first.grades.push(g); });
    first.counts = first.counts || x.counts; if(x.parts && !first.parts) first.parts = x.parts;
    (st.tests || []).forEach(t => { if(t.sid === x.id) t.sid = first.id; });
  });
  st.subjects = out; return st;
}
function lockedMig(st){
  if(!st.lockMig){ const L = st.locked || []; if(st.lockedPoints == null && L.length && L.every(l => l.g != null)) st.lockedPoints = L.reduce((a,l) => a + l.g, 0); st.lockMig = true; }
  if(st.lockedUnder && st.lockedUnder.length && st.lockedPoints != null){ st.lockedPoints -= st.lockedUnder.reduce((a,v) => a + (4 - v), 0); }
  st.lockedUnder = [];
  return st;
}
// v1.17: one A/B letter for everything. Language-2 lessons were relabelled so the times stay the same,
// OS TP groups 1/2 became A/B and two-room biology lessons became A/B TP halves: move hidden lessons and room edits along.
function abMig(st){
  if(st.abMig) return st; st.abMig = true;
  const t = st.tt; if(!t) return st;
  if(t.ans){ if(!t.ans.ab && t.ans.tp) t.ans.ab = t.ans.tp === "2" ? "B" : "A"; delete t.ans.tp; }
  const fix = k => { const p = String(k).split("|"); if(p.length !== 5) return [k];
    if(/^(Allemand|Italien)$/.test(p[2]) && /^[AB]$/.test(p[4])){ p[4] = p[4] === "A" ? "B" : "A"; return [p.join("|")]; }
    if(/TP$/.test(p[2]) && /^[12]$/.test(p[4])){ p[4] = p[4] === "1" ? "A" : "B"; return [p.join("|")]; }
    return [k]; };
  if(Array.isArray(t.hidden)) t.hidden = [...new Set(t.hidden.flatMap(fix))];
  if(t.rooms){ const r = {}; Object.entries(t.rooms).forEach(([k, v]) => fix(k).forEach(k2 => r[k2] = v)); t.rooms = r; }
  return st;
}
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.v === 1 && Array.isArray(s.subjects)){ const d = defaults(); return Object.assign(d, dedupe(migrate(lockedMig(abMig(s)))), {settings:Object.assign(d.settings, s.settings || {})}); } }catch(e){}
  return lockedMig(defaults());
}
let state = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast("Impossible d'enregistrer"); } }

/* ============ helpers ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const f2 = g => g == null ? "–" : String(Math.round(g * 100) / 100);
const half = g => Math.round(g * 2) / 2;
const col = g => g == null ? "" : g < 4 ? "c-red" : g < 4.5 ? "c-amber" : g >= 5 ? "c-green" : "";
const colVar = g => g < 4 ? "var(--red)" : g < 4.5 ? "var(--amber)" : g >= 5 ? "var(--green)" : "var(--ink)";
const sub = id => state.subjects.find(s => s.id === id);
// weights and shares: shown as fractions (1/4, 1/3, 1/2, 2/3, 3/4), never as 0.5
const FRACS = [[1,4],[1,3],[1,2],[2,3],[3,4]];
const W_CHIPS = [1/4, 1/3, 1/2, 1, 2, 3];
const sameW = (a, b) => Math.abs(a - b) < 0.002;
function frac(w){ if(w == null) return "–"; const f = FRACS.find(([a, b]) => sameW(w, a / b)); return f ? f[0] + "/" + f[1] : String(Math.round(w * 100) / 100); }
const wTxt = w => "×" + frac(w);
function parseW(v){ const m = String(v).trim().match(/^(\d+)\s*\/\s*(\d+)$/); if(m){ const n = +m[1] / +m[2]; return isFinite(n) && n > 0 ? n : null; } const n = num(v); return n && n > 0 ? n : null; }

/* ============ language ============
   The app is written in French. English and German are applied on top of it:
   every French text node / placeholder / aria-label is translated after it is rendered.
   To add or fix a translation, edit TX (whole texts), RU (texts with numbers or names) or VOC (subject names).
   Text that comes from the user must be wrapped in uesc() so that it is never translated. */
let LANG = "fr";
const uesc = s => '<span translate="no">' + esc(s) + "</span>";
const pl = (n, one, many) => +n === 1 ? one : many;
// [fr, en, de]: a whole text node
const TX = [
  /* navigation, home */
  ["Horaire","Schedule","Stundenplan"], ["Agenda","Agenda","Agenda"], ["Notes","Grades","Noten"],
  ["Réglages","Settings","Einstellungen"], ["Navigation","Navigation","Navigation"], ["Configuration","Setup","Einrichtung"],
  ["Retour","Back","Zurück"], ["Ajouter","Add","Hinzufügen"], ["Tutoriel","Tutorial","Tutorial"],
  ["Total des points","Total points","Gesamtpunkte"],
  ["Touche + pour ajouter ta première note.","Tap + to add your first grade.","Tippe auf +, um deine erste Note hinzuzufügen."],
  ["Branches","Subjects","Fächer"], ["Arrondies au demi-point","Rounded to the half point","Auf halbe Punkte gerundet"],
  ["Moyennes exactes","Exact averages","Genaue Durchschnitte"], ["Travail de maturité","Matura project","Maturaarbeit"],
  ["Compte comme une note","Counts as one grade","Zählt als eine Note"], ["Notes bloquées","Locked grades","Gesperrte Noten"],
  ["Chimie, physique, arts","Chemistry, physics, arts","Chemie, Physik, Kunst"], ["Hors total","Outside the total","Ausserhalb des Totals"],
  ["Plus","More","Mehr"], ["Évolution","Trend","Verlauf"],
  ["Ta moyenne au fil de l'année","Your average over the year","Dein Durchschnitt im Jahresverlauf"],
  ["Examens","Exams","Prüfungen"], ["Simule tes examens de maturité","Simulate your matura exams","Simuliere deine Maturaprüfungen"],
  ["Pas encore de note","No grades yet","Noch keine Noten"],
  /* subject screen */
  ["Arrondie","Rounded","Gerundet"], ["Moyenne","Average","Durchschnitt"], ["Exacte","Exact","Exakt"],
  ["Touche pour modifier","Tap to edit","Zum Bearbeiten tippen"],
  ["Pas encore de note. Touche + pour en ajouter une.","No grades yet. Tap + to add one.","Noch keine Noten. Tippe auf +, um eine hinzuzufügen."],
  ["Tests à venir","Upcoming tests","Kommende Tests"], ["De combien ai-je besoin ?","What do I need?","Was brauche ich?"],
  ["Objectif (après arrondi)","Target (after rounding)","Ziel (nach Rundung)"], ["Objectif (moyenne)","Target (average)","Ziel (Durchschnitt)"],
  ["Le prochain test est en","The next test is in","Der nächste Test ist in"],
  ["Poids du prochain test","Weight of the next test","Gewicht des nächsten Tests"],
  ["Branche","Subject","Fach"], ["Compte dans mon total","Counts toward my total","Zählt für mein Total"], ["Test","Test","Test"],
  ["N'importe quelle note de","Any grade of","Jede Note von"], ["ou plus suffit.","or higher is enough.","oder höher genügt."],
  ["Impossible en un seul test. Il te faudrait","Not possible in a single test. You would need","In einem einzigen Test nicht möglich. Du bräuchtest"],
  ["Il te faut au moins","You need at least","Du brauchst mindestens"],
  /* grade sheet */

  let h = `<section class="card hero"><div class="lab">Total des points</div>`;
  if(o){
    const diff = r(o.total - o.need), ok = diff >= 0 && o.under.length <= 4;
    const max = 6 * o.n, pct = Math.max(0, o.total) / max * 100, minPct = o.need / max * 100;
    h += `<div class="big ${ok ? (diff >= o.n * 0.5 ? "c-green" : "") : "c-red"}">${f2(r(o.total))}</div>
      <div class="break">${diff >= 0 ? `<b class="c-green">+${f2(diff)}</b> au-dessus du minimum (${o.need})` : `<b class="c-red">${f2(-diff)} de moins</b> que le minimum (${o.need})`}</div>
      <div class="scale"><div class="fill" style="width:${pct}%;background:${ok ? "var(--green)" : "var(--red)"}"></div><div class="pass" style="left:${minPct}%"></div></div>
      <div class="checks">
        <div class="${diff >= 0 ? "c-green" : "c-red"}">${diff >= 0 ? "✓" : "✗"} ${o.need} points minimum</div>
        <div class="${o.under.length <= 4 ? "c-green" : "c-red"}">${o.under.length <= 4 ? "✓" : "✗"} ${o.under.length ? o.under.length + (o.under.length > 1 ? " notes" : " note") + " sous 4, max. 4" : "Aucune note sous 4"}${o.under.length ? " (" + o.under.map(x => esc(x.name)).join(", ") + ")" : ""}</div>
      </div>
      <div class="break" style="margin-top:10px">Moyenne ${f2(r(o.avg))}${o.n < o.expected ? `, ${o.n} notes sur ${o.expected}` : ""}</div>`;
  } else h += `<div class="big muted">–</div><div class="break">Touche + pour ajouter ta première note.</div>`;
  h += `</section>`;
  const counted = state.subjects.filter(s => s.counts), extra = state.subjects.filter(s => !s.counts);
  h += `<h2>Branches<small>${state.settings.round ? "Arrondies au demi-point" : "Moyennes exactes"}</small></h2>
    <div class="seg3" role="tablist">${[[0, "Année"], [1, "Semestre 1"], [2, "Semestre 2"]].map(([v, l]) => `<button role="tab" data-act="sem" data-v="${v}" aria-selected="${homeSem === v}">${l}</button>`).join("")}</div>
    ${homeSem ? `<p class="note" style="margin:-2px 2px 8px">Moyennes du semestre ${homeSem}, juste pour voir. Le total en haut compte toute l'année.</p>` : ""}
    <div class="list">${counted.map(rowHTML).join("")}</div>`;
  { const lp = state.lockedPoints;
  h += `<div class="list" style="margin-top:8px">
    <button class="row" data-act="tm"><div class="rname"><b>Travail de maturité</b><span>Compte comme une note</span></div><div class="rval ${state.tm.g != null ? col(state.tm.g) : "none"}">${state.tm.g != null ? f2(state.tm.g) : "Ajouter"}</div></button>
    <button class="row" data-act="lockedpts">${lockSvg}<div class="rname"><b>Notes bloquées</b><span>Chimie, physique, arts</span></div><div class="rval ${lp == null ? "none" : lp - 12 > 0 ? "c-green" : lp - 12 < 0 ? "c-red" : ""}">${lp != null ? bonusTxt(lp - 12) : "Ajouter"}</div></button></div>`; }
  if(extra.length) h += `<h2>Hors total</h2><div class="list">${extra.map(rowHTML).join("")}</div>`;
  h += `<h2>Plus</h2><div class="row2"><button class="tile" data-act="trend"><b>Évolution</b><span>Ta moyenne au fil de l'année</span></button><button class="tile" data-act="exams"><b>Examens</b><span>Simule tes examens de maturité</span></button></div>`;
  $("main").innerHTML = h;

function rowHTML(s0){
  const s = semSub(s0, homeSem), a = avg(s), f = final(s), n = s.grades.length;

/* ============ subject screen ============ */
let openId = null, needT = 4, needW = 1, needP = "philo";
function openSubject(id){ openId = id; const s0 = sub(id); if(s0 && s0.parts && !s0.parts.some(p => p.key === needP)) needP = s0.parts[0].key; renderSubject(); $("screen").classList.add("on"); }
function closeSubject(){ examOpen = false; $("fab").style.display = ""; openId = null; $("screen").classList.remove("on"); renderHome(); }
function spark(s){
  const g = s.grades; if(g.length < 2) return "";
  const W = 320, H = 90, p = 8, x = i => p + i * (W - 2*p) / (g.length - 1), y = v => H - p - (v - 1) / 5 * (H - 2*p);
  const pts = g.map((v, i) => `${x(i).toFixed(1)},${y(v.g).toFixed(1)}`).join(" ");
  return `<div class="card" style="padding:12px 12px 6px;margin-bottom:10px"><svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" x2="${W}" y1="${y(4)}" y2="${y(4)}" stroke="#4A4A4E" stroke-dasharray="4 4" stroke-width="1"/>
    <polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${g.map((v, i) => `<circle cx="${x(i)}" cy="${y(v.g)}" r="3.5" fill="${colVar(v.g)}" vector-effect="non-scaling-stroke"/>`).join("")}</svg></div>`;
}
function renderSubject(){
  const s = sub(openId); if(!s){ closeSubject(); return; }
  const a = avg(s), f = final(s), W = s.grades.reduce((x,g) => x + g.w, 0);
  let h = `<div class="shead"><button class="icon" data-act="back" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><h1>${esc(s.name)}</h1></div>
    <div class="stats">
      <div class="stat"><b class="${col(f)}">${f2(f)}</b><span>${state.settings.round ? "Arrondie" : "Moyenne"}</span></div>
      <div class="stat"><b>${a == null ? "–" : f2(Math.round(a*100)/100)}</b><span>Exacte</span></div>
      <div class="stat"><b>${s.grades.length}</b><span>${W ? "Poids total " + frac(W) : "Notes"}</span></div></div>`;
  if(s.parts) h += `<div class="list" style="margin-bottom:10px">${s.parts.map(p => { const a = partAvg(s, p.key), n = s.grades.filter(x => x.part === p.key).length;
    return `<div class="row" style="cursor:default"><div class="rname"><b>${esc(p.name)}</b><span>Compte pour ${shareTxt(s, p)}, ${n} ${n > 1 ? "notes" : "note"}</span></div><div class="rval ${a == null ? "none" : col(a)}">${a == null ? "–" : f2(Math.round(a*100)/100)}</div></div>`; }).join("")}</div>`;
  if(s.grades.length){
    const cs = curSem();
    h += `<div class="semrow">${[1, 2].map(n => { const x = semSub(s, n), fa = final(x), k = x.grades.length;
      return `<div class="semc${n === cs ? " cur" : ""}"><span>Semestre ${n}</span><b class="${col(fa)}">${f2(fa)}</b><small>${k ? k + (k > 1 ? " notes" : " note") : "Pas encore de note"}</small></div>`; }).join("")}</div>`;
  }
  h += spark(s);
  if(s.grades.length){
    const grow = g => `
      <button class="grow" data-act="editg" data-id="${g.id}"><span class="gbadge ${col(g.g)}">${f2(g.g)}</span><div class="rname"><b>${g.name ? uesc(g.name) : "Test"}</b><span>${s.parts && g.part ? esc((s.parts.find(p => p.key === g.part) || {}).name || "") + ", " : ""}${fmtD(new Date(g.date))}</span>${g.mix ? `<span class="mixline" translate="no">${esc(mixTxt(g.mix))}</span>` : ""}</div><span class="gw">${wTxt(g.w)}</span></button>`;
    [2, 1].forEach(n => { const gs = s.grades.filter(g => semOf(g.date) === n).reverse(); if(!gs.length) return;
      h += `<h2>Semestre ${n}<small>Touche pour modifier</small></h2><div class="list">${gs.map(grow).join("")}</div>`; });
  } else h += `<div class="card muted" style="text-align:center;padding:26px">Pas encore de note. Touche + pour en ajouter une.</div>`;
  { const st = sortTests(openTests().filter(x => x.sid === s.id && x.date >= todayIso()));
    if(st.length) h += `<h2>Tests à venir</h2>${st.map(x => testCard(x, "act")).join("")}`; }
  h += `<h2>De combien ai-je besoin ?</h2><div class="card need">
    <div><span class="lab2" style="margin-top:0">Objectif ${state.settings.round ? "(après arrondi)" : "(moyenne)"}</span><div class="chips">${[4,4.5,5,5.5,6].map(t => `<button class="chip" data-act="needt" data-v="${t}" aria-pressed="${needT === t}">${t}</button>`).join("")}</div></div>
    ${s.parts ? `<div><span class="lab2" style="margin-top:0">Le prochain test est en</span><div class="chips">${s.parts.map(p => `<button class="chip" data-act="needp" data-v="${p.key}" aria-pressed="${needP === p.key}">${esc(p.name)}</button>`).join("")}</div></div>` : ""}
    <div><span class="lab2" style="margin-top:0">Poids du prochain test</span><div class="chips">${W_CHIPS.slice(0, 5).map(w => `<button class="chip" data-act="needw" data-v="${w}" aria-pressed="${sameW(needW, w)}">${wTxt(w)}</button>`).join("")}</div></div>
    <div class="needres" id="needres"></div></div>
    <h2>Branche</h2><div class="card">
      <div class="setting" style="padding-top:0"><p>Compte dans mon total</p><button class="switch" role="switch" data-act="counts" aria-checked="${s.counts}"></button></div>
    </div>`;
  $("screenBody").innerHTML = h;
  renderNeed();
}
function renderNeed(){
  const s = sub(openId), el = $("needres"); if(!s || !el) return;
  if(!s.grades.length){ el.innerHTML = `N'importe quelle note de <b>${needT}</b> ou plus suffit.`; return; }
  const n = needed(s, needT, needW, needP);
  if(n <= 1) el.innerHTML = `C'est déjà acquis. Même un 1 te garde à ${needT} ou plus.`;
  else if(n > 6) el.innerHTML = `Impossible en un seul test. Il te faudrait <b class="c-red">${f2(Math.round(n*100)/100)}</b>.`;
  else el.innerHTML = `Il te faut au moins <b class="${col(n)}">${(Math.ceil(n * 10) / 10).toFixed(1)}</b> au prochain test${s.parts ? " de " + esc((s.parts.find(p => p.key === needP) || s.parts[0]).name.toLowerCase()) : ""}.`;
}

/* ============ sheets ============ */
function openSheet(html){ $("sheetBody").innerHTML = html; $("sheet").classList.add("on"); }
function closeSheet(){ $("sheet").classList.remove("on"); }
$("sheet").addEventListener("click", e => { if(e.target.id === "sheet") closeSheet(); });

let draft = null;
const SHARES = [1/4, 1/3, 1/2, 2/3, 3/4];
// a grade made of parts (e.g. 1/3 + 2/3): parts without a mark don't count yet
function mixGrade(mix){ const f = (mix || []).filter(p => num(p.g) != null && num(p.g) >= 1 && num(p.g) <= 6); if(!f.length) return null;
  return f.reduce((a, p) => a + num(p.g) * p.s, 0) / f.reduce((a, p) => a + p.s, 0); }
const mixTxt = mix => mix.map(p => (p.g == null || p.g === "" ? "?" : f2(num(p.g))) + " " + wTxt(p.s)).join(" + ");
function gradeSheet(g, preset){
  // g: existing grade object for edit, or null
  const editing = !!g;
  draft = editing ? {sid:g.sid, id:g.id, g:String(g.g), w:g.w, name:g.name || "", part:g.part || null, date:(g.date || "").slice(0, 10) || todayIso(),
      mix:g.mix ? g.mix.map(p => ({g:p.g == null ? "" : String(p.g), s:p.s})) : null, editing:true} :
    {sid: openId || state.settings.lastSub || state.subjects[0].id, g:"", w:state.settings.lastW || 1, name:"", part:state.settings.lastPart || "philo", date:todayIso(), mix:null, editing:false};
  if(!editing && preset) Object.assign(draft, preset);
  if(!sub(draft.sid)) draft.sid = state.subjects[0].id;
  drawGradeSheet(editing);
  if(!editing && !draft.mix) setTimeout(() => { const i = $("gIn"); i && i.focus(); }, 320);
}
function mixRows(d){
  return d.mix.map((p, i) => `<div class="mixrow"><input class="inp mixg" data-mi="${i}" inputmode="decimal" placeholder="–" value="${esc(p.g)}">
    <div class="chips">${SHARES.map(v => `<button class="chip" data-g="share" data-i="${i}" data-v="${v}" aria-pressed="${sameW(p.s, v)}">${frac(v)}</button>`).join("")}</div>
    ${d.mix.length > 2 ? `<button class="mini" data-g="mixdel" data-i="${i}" aria-label="Supprimer">✕</button>` : ""}</div>`).join("");
}
function mixTotal(){ const el = $("mixTot"); if(!el || !draft || !draft.mix) return; const v = mixGrade(draft.mix), miss = draft.mix.some(p => num(p.g) == null);
  el.innerHTML = v == null ? `<span class="muted">Note combinée : –</span>` : `Note combinée : <b class="${col(v)}">${f2(Math.round(v * 100) / 100)}</b>${miss ? `<small>Les parties sans note ne comptent pas encore.</small>` : ""}`; }
function drawGradeSheet(editing){
  const d = draft, wOther = !W_CHIPS.some(w => sameW(w, d.w));
  openSheet(`<h3>${editing ? "Modifier la note" : "Ajouter une note"}</h3>
    ${editing ? "" : `<span class="lab2">Branche</span><div class="chips">${state.subjects.map(s => `<button class="chip" data-g="sub" data-v="${s.id}" aria-pressed="${d.sid === s.id}">${esc(s.name)}</button>`).join("")}</div>`}
    ${sub(d.sid).parts ? `<span class="lab2">Partie</span><div class="chips">${sub(d.sid).parts.map(p => `<button class="chip" data-g="part" data-v="${p.key}" aria-pressed="${(sub(d.sid).parts.some(q => q.key === d.part) ? d.part : sub(d.sid).parts[0].key) === p.key}">${esc(p.name)} (${shareTxt(sub(d.sid), p)})</button>`).join("")}</div>` : ""}
    ${d.mix ? `<span class="lab2">Parties de la note (chacune de 1 à 6)</span><div id="mixBox">${mixRows(d)}</div>
      <div class="mixfoot"><button class="mini" data-g="mixadd">+ Ajouter une partie</button><span class="mixtot" id="mixTot"></span></div>
      <button class="textlink" data-g="mixoff" style="margin:4px 0 0">Une seule note</button>`
    : `<span class="lab2">Note (de 1 à 6, suffisant dès 4)</span><input class="gradein" id="gIn" inputmode="decimal" placeholder="5.5" value="${esc(d.g)}">
      <button class="textlink" data-g="mixon" style="margin:4px 0 0">Note en plusieurs parties (p. ex. 1/3 + 2/3)</button>`}
    <span class="lab2">Pondération</span><div class="chips">${W_CHIPS.map(w => `<button class="chip" data-g="w" data-v="${w}" aria-pressed="${sameW(d.w, w)}">${wTxt(w)}</button>`).join("")}
      <input class="num" id="wIn" inputmode="text" placeholder="autre" value="${wOther ? frac(d.w) : ""}" style="height:38px;width:76px;font-size:17px"></div>
    <div class="row2"><div><span class="lab2">Nom (facultatif)</span><input class="inp" id="nIn" placeholder="p. ex. TS chapitre 3" value="${esc(d.name)}"></div>
      <div><span class="lab2">Date</span><input class="inp" type="date" id="gDate" value="${esc(d.date)}"></div></div>
    <button class="primary" data-g="save">${editing ? "Enregistrer" : "Ajouter la note"}</button>
    ${editing ? `<button class="secondary danger" data-g="del">Supprimer la note</button>` : ""}`);
  if($("gIn")) $("gIn").oninput = e => d.g = e.target.value;
  if(d.mix){ $("mixBox").oninput = e => { const i = e.target.dataset.mi; if(i != null){ d.mix[+i].g = e.target.value; mixTotal(); } }; mixTotal(); }
  $("nIn").oninput = e => d.name = e.target.value;
  $("gDate").oninput = e => { if(e.target.value) d.date = e.target.value; };
  $("wIn").oninput = e => { const v = parseW(e.target.value); if(v){ d.w = v; document.querySelectorAll('[data-g="w"]').forEach(c => c.setAttribute("aria-pressed", "false")); } };
}
$("sheetBody").addEventListener("click", e => {
  const b = e.target.closest("[data-g]"); if(!b || !draft) return;
  const d = draft, k = b.dataset.g, redraw = () => { const y = $("sheetBody").scrollTop; drawGradeSheet(d.editing); $("sheetBody").scrollTop = y; };
  if(k === "sub"){ const had = !!sub(d.sid).parts; d.sid = b.dataset.v; if(had !== !!sub(d.sid).parts) redraw(); else document.querySelectorAll('[data-g="sub"]').forEach(c => c.setAttribute("aria-pressed", c === b)); }
  if(k === "part"){ d.part = b.dataset.v; document.querySelectorAll('[data-g="part"]').forEach(c => c.setAttribute("aria-pressed", c === b)); }
  if(k === "w"){ d.w = +b.dataset.v; $("wIn").value = ""; document.querySelectorAll('[data-g="w"]').forEach(c => c.setAttribute("aria-pressed", c === b)); }
  if(k === "mixon"){ d.mix = [{g:d.g || "", s:1/3}, {g:"", s:2/3}]; redraw(); setTimeout(() => { const i = document.querySelector(".mixg"); i && i.focus(); }, 50); }
  if(k === "mixoff"){ const v = mixGrade(d.mix); d.g = v == null ? "" : String(Math.round(v * 100) / 100); d.mix = null; redraw(); }
  if(k === "mixadd"){ d.mix.push({g:"", s:1/3}); redraw(); }
  if(k === "mixdel"){ d.mix.splice(+b.dataset.i, 1); redraw(); }
  if(k === "share"){ d.mix[+b.dataset.i].s = +b.dataset.v; b.parentElement.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b)); mixTotal(); }
  if(k === "save"){
    let g, mix = null;
    if(d.mix){
      g = mixGrade(d.mix);
      if(g == null){ toast("Entre au moins une partie entre 1 et 6"); const i = document.querySelector(".mixg"); i && i.focus(); return; }
      g = Math.round(g * 100) / 100;
      mix = d.mix.map(p => { const v = num(p.g); return {g:v != null && v >= 1 && v <= 6 ? v : null, s:p.s}; });
    } else {
      g = num(d.g);
      if(g == null || g < 1 || g > 6){ toast("Entre une note entre 1 et 6"); $("gIn").focus(); return; }
    }
    const s = sub(d.sid), part = s.parts ? (s.parts.some(q => q.key === d.part) ? d.part : s.parts[0].key) : undefined;
    const today = todayIso(), date = d.date && d.date !== today ? d.date + "T12:00:00.000Z" : new Date().toISOString();
    if(d.id){ const x = s.grades.find(x => x.id === d.id); x.g = g; x.w = d.w; x.name = d.name.trim(); if(part) x.part = part;
      if((x.date || "").slice(0, 10) !== d.date) x.date = date;
      if(mix) x.mix = mix; else delete x.mix; toast("Enregistré"); }
    else { const ng = {id:uid(), g, w:d.w, name:d.name.trim(), date, ...(part ? {part} : {}), ...(mix ? {mix} : {})};
      s.grades.push(ng); s.grades.sort((a, b) => (a.date || "") < (b.date || "") ? -1 : (a.date || "") > (b.date || "") ? 1 : 0);
      state.settings.lastSub = d.sid; state.settings.lastW = d.w; if(part) state.settings.lastPart = part;
      if(d.testId){ const t = tests().find(x => x.id === d.testId); if(t){ t.gid = ng.id; t.gsid = s.id; } }
      toast(f2(g) + " ajouté en " + (part ? s.parts.find(p => p.key === part).name : s.name)); }
    save(); closeSheet(); draft = null; refreshAll();
  }
  if(k === "del"){
    const s = sub(d.sid), i = s.grades.findIndex(x => x.id === d.id), [gone] = s.grades.splice(i, 1);
    save(); closeSheet(); draft = null; refreshAll();
    toast("Note supprimée", {label:"Annuler", fn:() => { s.grades.splice(i, 0, gone); save(); refreshAll(); }});
  }
});

function valueSheet(title, sub, val, onSave, onClear, min = 1, max = 6){
  openSheet(`<h3>${esc(title)}</h3><p class="note" style="margin:0 0 4px">${esc(sub)}</p>
    <input class="gradein" id="vIn" inputmode="decimal" placeholder="–" value="${val ?? ""}" style="margin-top:12px">
    <button class="primary" id="vSave">Enregistrer</button>${val != null ? `<button class="secondary danger" id="vClear">Effacer</button>` : ""}`);
  $("vSave").onclick = () => { const v = num($("vIn").value); if(v == null || v < min || v > max){ toast(`Entre un nombre entre ${min} et ${max}`); return; } onSave(v); save(); closeSheet(); refresh(); };
  if($("vClear")) $("vClear").onclick = () => { onClear(); save(); closeSheet(); refresh(); };
  setTimeout(() => $("vIn").focus(), 320);
}

const sico = k => `<span class="sico" style="--c:${SICO[k][0]}"><svg viewBox="0 0 24 24">${SICO[k][1]}</svg></span>`;
const srow = (id, k, t, d, extra) => `<button class="srow${extra ? " " + extra : ""}" id="${id}">${sico(k)}<span class="rname"><b>${t}</b><span>${d}</span></span>${CHEV}</button>`;
function openSettings(){ setPage = "main"; $("fab").style.display = "none"; drawSettings(0); $("setScreen").classList.add("on"); }
function closeSettings(){ setPage = null; $("setScreen").classList.remove("on"); $("fab").style.display = ""; }
function goSet(p, dir){ setPage = p; drawSettings(dir); }
function drawSettings(dir){
  const st = state.settings, pg = setPage, meta = SPAGES.find(x => x[0] === pg);
  let h = `<div class="shead"><button class="icon" data-set="back" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><h1>${pg === "main" ? "Réglages" : meta[1]}</h1></div>`;
  if(pg === "main"){
    h += SPAGES.map(([id, t, d]) => `<button class="srow" data-set="go" data-p="${id}">${sico(id)}<span class="rname"><b>${t}</b><span>${id === "lang" ? (LANG_NAMES[st.lang] ? `<span translate="no">${LANG_NAMES[st.lang]}</span>` : "Automatique, suit ton téléphone") : d}</span></span>${CHEV}</button>`).join("")
      + `<p class="note" style="margin:6px 2px 0">Tout reste sur ce téléphone.</p>`;
  } else if(pg === "look"){
    h += `<div class="scard"><b>Thème</b><span>Clair, sombre ou comme ton téléphone.</span>
        <div class="chips" id="themeChips" style="margin-top:10px">${[["system","Comme le téléphone"],["light","Clair"],["dark","Sombre"]].map(([v, l]) => `<button class="chip" data-v="${v}" aria-pressed="${(st.theme || "system") === v}">${l}</button>`).join("")}</div></div>
      <div class="scard"><div class="setting" style="padding:0"><p>Arrondir les moyennes au demi-point<small>Comme sur le bulletin. Désactive pour voir les moyennes exactes.</small></p><button class="switch" role="switch" id="roundSw" aria-checked="${st.round}"></button></div></div>
      <div class="scard"><b>Début du 2e semestre</b><span>Sert seulement à séparer tes notes en semestre 1 et 2. Ne change ni tes moyennes ni ton total.</span>
        <input class="inp" type="date" id="semIn" value="${semBoundary()}" style="margin-top:10px"></div>`;
  } else if(pg === "lang"){
    h += `<p class="note" style="margin:0 2px 12px">Par défaut, l'app suit la langue de ton téléphone.</p>
      <button class="opt" data-lang="auto" aria-pressed="${!LANG_NAMES[st.lang]}"><b>Automatique</b><span>Suit la langue du téléphone</span></button>
      ${Object.keys(LANG_NAMES).map(c => `<button class="opt" data-lang="${c}" aria-pressed="${st.lang === c}"><b translate="no">${LANG_NAMES[c]}</b><span>${{fr:"Langue d'origine de l'app", en:"Traduction anglaise", de:"Traduction allemande"}[c]}</span></button>`).join("")}`;
  } else if(pg === "sched"){
    const t = tt(), n = t.hidden.length;
    h += srow("redo", "redo", "Refaire la configuration", t.cls ? `Classe ${t.cls}${t.ans.ab ? ", groupe " + t.ans.ab : ""}. Change ta classe, tes groupes ou tes options.` : "Choisis ta classe, tes groupes et tes options.")
      + srow("unhide", "hidden", n ? `Cours masqués (${n})` : "Cours masqués", n ? "Touche pour faire revenir tous les cours que tu as masqués." : "Aucun cours masqué. Masque un cours en le touchant dans l'horaire.")
      + srow("icsOut", "ics", "Exporter vers un agenda", "Un fichier .ics avec tes tests et devoirs à venir, pour Google ou Apple Agenda.");
  } else if(pg === "subs"){
    h += `<p class="note" style="margin:0 2px 12px">Renomme, change l'ordre ou supprime tes branches. Une branche supprimée perd ses notes.</p>
      <div class="card"><div id="subList"></div><div class="mrow"><input class="inp" id="newSub" placeholder="Nouvelle branche"><span></span><button class="mini" id="addSub">Ajouter</button></div></div>`;
  } else if(pg === "help"){
    h += srow("tutAgain", "tut", "Revoir le tutoriel", "Le petit tour de l'app, en six étapes.")
      + srow("fbOpen", "fb", "Envoyer un feedback", "Un bug, une idée ou un cours au mauvais endroit.")
      + `<div class="srow static">${sico("info")}<span class="rname"><b>Matu <span translate="no">${APP_VERSION}</span></b><span>Faite pour les élèves du gymnase. Marche aussi sans connexion.</span></span></div>`;
  } else if(pg === "data"){
    h += srow("exp", "exp", "Exporter une sauvegarde", "Un fichier avec toutes tes notes, tests, devoirs et réglages.")
      + srow("imp", "imp", "Importer une sauvegarde", "Remplace tes données par un fichier exporté avant.")
      + srow("wipe", "wipe", "Tout effacer", "Notes, tests, devoirs et horaire. C'est définitif.", "danger")
      + `<p class="note" style="margin:6px 2px 0">Tout reste sur ce téléphone. L'app n'envoie rien en ligne.</p>`;
  }
  const el = $("setBody"); el.innerHTML = h; $("setScreen").scrollTop = 0;
  const on = (id, fn) => { const b = $(id); if(b) b.onclick = fn; };

  on("roundSw", e => { st.round = !st.round; e.currentTarget.setAttribute("aria-checked", st.round); save(); refresh(); });

  on("redo", () => { closeSettings(); openOnboarding("class"); });
  on("fbOpen", () => feedbackSheet());
  on("icsOut", exportIcs);

  on("unhide", () => { const n = tt().hidden.length; tt().hidden = []; tt().rooms = {}; save(); closeSettings(); renderSched(); toast(n ? "Les cours masqués sont de retour" : "Aucun cours masqué"); });
  on("exp", exportData); on("imp", () => $("importFile").click());
  on("wipe", () => { if(confirm(tr("Effacer toutes les notes et les branches ?")) && confirm(tr("C'est définitif. Tout effacer ?"))){ state = defaults(); save(); closeSettings(); applyLang(); refresh(); renderSched(); toast("Tout a été effacé"); } });
  if($("themeChips")) $("themeChips").onclick = e => { const c = e.target.closest(".chip"); if(!c) return; st.theme = c.dataset.v; save(); applyTheme();
    $("themeChips").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c)); };

}
$("setBody").addEventListener("click", e => {
  const b = e.target.closest("[data-set],[data-lang]"); if(!b) return;
  if(b.dataset.lang){ if(b.dataset.lang === "auto") delete state.settings.lang; else state.settings.lang = b.dataset.lang; save(); applyLang(); drawSettings(0); return; }
  const a = b.dataset.set;
  if(a === "go") goSet(b.dataset.p, 1);
  if(a === "back"){ if(setPage === "main") closeSettings(); else goSet("main", -1); }
});
function drawManage(){
  $("subList").innerHTML = state.subjects.map((s, i) => `<div class="mrow" data-i="${i}"><input class="inp" data-m="sname" value="${esc(s.name)}"><button class="mini" data-m="sup" ${i ? "" : "disabled"}>↑</button><button class="mini danger" data-m="sdel">✕</button></div>`).join("");
  $("subList").querySelectorAll(".mrow").forEach(r => r.style.gridTemplateColumns = "1fr 46px 46px");
}
[$("sheetBody"), $("setBody")].forEach(box => box.addEventListener("input", e => {
  const m = e.target.dataset.m; if(!m) return;
  const i = +e.target.closest(".mrow").dataset.i;
  if(m === "sname"){ state.subjects[i].name = e.target.value; save(); renderHome(); }
  if(m === "lname"){ state.locked[i].name = e.target.value; save(); renderHome(); }
}));
[$("sheetBody"), $("setBody")].forEach(box => box.addEventListener("click", e => {
  const b = e.target.closest("[data-m]"); if(!b || b.tagName === "INPUT") return;
  const i = +b.closest(".mrow").dataset.i, m = b.dataset.m;
  if(m === "sup" && i > 0){ [state.subjects[i-1], state.subjects[i]] = [state.subjects[i], state.subjects[i-1]]; }
  if(m === "sdel"){ const s = state.subjects[i]; if(!confirm(tr(`Supprimer ${s.name}${s.grades.length ? " et ses " + s.grades.length + " notes" : ""} ?`))) return; state.subjects.splice(i, 1); }
  if(m === "ldel"){ if(!confirm(tr("Supprimer " + state.locked[i].name + " ?"))) return; state.locked.splice(i, 1); }
  save(); drawManage(); renderHome();
}));

function exportData(){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], {type:"application/json"}));
  a.download = "matu-sauvegarde-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove(); toast("Sauvegarde exportée");
}
$("importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  try{ const d = JSON.parse(await f.text()); if(!d || !Array.isArray(d.subjects)) throw 0;
    if(!confirm(tr("Remplacer tes données par cette sauvegarde ?"))) return;
    const x = defaults(); state = Object.assign(x, migrate(lockedMig(abMig(d))), {settings:Object.assign(x.settings, d.settings || {})}); save(); closeSheet(); refresh(); renderSched(); toast("Sauvegarde importée");
  }catch(err){ toast("Ce fichier n'est pas une sauvegarde de l'app"); }
};

// keyboard "Enter"/"OK" submits the open form
document.addEventListener("focusin", e => { if(e.target.tagName === "INPUT") e.target.enterKeyHint = "done"; });
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  const box = e.target.closest("#sheetBody, #obSlide, #setBody"); if(!box) return;
  e.preventDefault();
  if(e.target.id === "newSub"){ $("addSub").click(); return; }
  if(e.target.dataset.m){ e.target.blur(); return; }
  const p = box.querySelector(".primary"); if(p) p.click(); else e.target.blur();
});

let tT;
function toast(msg, action){
  const t = $("toast"); t.textContent = msg;
  if(action){ const b = document.createElement("button"); b.className = "tact"; b.textContent = action.label; b.onclick = () => { t.classList.remove("on"); action.fn(); }; t.appendChild(b); }
  t.classList.add("on"); clearTimeout(tT); tT = setTimeout(() => t.classList.remove("on"), action ? 6000 : 2400);
}

/* ============ timetable engine ============ */
const PERIODS = {1:["08:10","08:55"],2:["09:00","09:45"],3:["10:05","10:50"],4:["10:55","11:40"],5:["11:45","12:30"],6:["12:35","13:20"],7:["13:25","14:10"],8:["14:15","15:00"],9:["15:10","15:55"],10:["16:00","16:45"]};
const DAYS = ["Mon","Tue","Wed","Thu","Fri"];
let DAYS_FR = ["Lun","Mar","Mer","Jeu","Ven"], DAYNAMES = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi"];
const RX = /^(Mon|Tue|Wed|Thu|Fri) (\d+)(?:-(\d+))? ([^@#]+?)\s*(?:@([^#]+?))?\s*((?:#\S+\s*)*)$/;
const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const PALETTE = ["#F2A3C2","#93C3F2","#9FDDBE","#C7B5F4","#EBCB7A","#F5B38A","#8FD3D9","#E8A0A0","#B7D58A","#D9DCE0"];
function colorFor(name){ const base = name.replace(/\s*\(.*\)|\s*TP$/g, "").replace(/ (renforcé|standard|bilingue)$/, ""); let h = 0; for(const c of base) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }
function parseL(s, extra){
  const m = s.match(RX); if(!m) return null;
  const tags = {}; (m[6] || "").trim().split(/\s+/).filter(Boolean).forEach(t => { const [k, v] = t.slice(1).split("="); tags[k] = v; });
  return Object.assign({day:DAYS.indexOf(m[1]), p1:+m[2], p2:+(m[3] || m[2]), name:m[4].trim(), room:(m[5] || "").trim(), tags}, extra || {});
}

const osLabel = code => GROUPS[code] ? GROUPS[code].label : (OSMAP[code] ? OSMAP[code].long : code);
const osOf = code => code ? OSMAP[code.replace(/\d+$/, "")] : null;

function tt(){ if(!state.tt) state.tt = {cls:null, ans:{}, art:null, oc:null, ocSlots:null, hidden:[], extra:[], rooms:{}}; return state.tt; }
const groupsOf = (cls, dim) => (CLASSES[cls] ? CLASSES[cls].g : []).filter(g => GROUPS[g].dim === dim);
function effOS(){ const t = tt(); if(t.ans.os) return t.ans.os; const g = groupsOf(t.cls, "os"); return g.length === 1 ? g[0] : null; }

// The option block of a class: the times its option spécifique groups share.
function osBlock(cls){
  const gs = groupsOf(cls, "os"); if(!gs.length) return [["Mon",9,9],["Tue",7,8],["Fri",1,2]];
  const count = {};
  gs.forEach(g => { const seen = new Set(); GROUPS[g].L.forEach(x => { const l = parseL(x); const k = DAYS[l.day] + "|" + l.p1 + "|" + l.p2; if(!seen.has(k)){ seen.add(k); count[k] = (count[k] || 0) + 1; } }); });
  const need = Math.min(2, gs.length);
  return Object.entries(count).filter(([, n]) => n >= need).map(([k]) => { const [d, a, b] = k.split("|"); return [d, +a, +b]; });
}
function ocWhen(oc){
  const sl = (OC_SLOTS[oc] || []).map(x => parseL(x));
  if(!sl.length) return "Jeudi après-midi";
  if(sl.length > 1) return "Jeudi après-midi, " + sl.length + " blocs";
  return `${DAYNAMES[3]}, de ${PERIODS[sl[0].p1][0]} à ${PERIODS[sl[0].p2][1]}`;
}
const ocSlots = oc => OC_SLOTS[oc] || (oc ? ["Thu 6-8 " + oc + " (OC)"] : []);
/* Biology "@room1, room2": a 4-week cycle. 2 weeks of normal class in room 1, then 2 weeks of TP in room 2:
   group A the first TP week, group B the second. The student sets which week it is once (tt().bio = {ref, ph}). */
const isSchoolWeek = m => [0, 1, 2, 3, 4].some(i => { const d = new Date(m); d.setDate(d.getDate() + i); return !holidayOn(iso(d)); });
function schoolWeeksBetween(a, b){
  const step = b > a ? 1 : -1, d = new Date(a); let n = 0;
  for(let i = 0; i < 120 && iso(d) !== iso(b); i++){ d.setDate(d.getDate() + 7 * step); if(isSchoolWeek(d)) n += step; }
  return n;
}
function bioPhase(mon){ const b = tt().bio; if(!mon || !b) return null; return ((b.ph + schoolWeeksBetween(fromIso(b.ref), mondayOf(mon))) % 4 + 4) % 4; }
function weekLessons(mon){
  const t = tt(), C = CLASSES[t.cls]; let out = [];
  if(C){
    C.L.forEach(s => { const l = parseL(s); if(!l) return;
      const rooms = l.room.split(/,\s*/);
      if(/^Biologie$/.test(l.name) && rooms.length === 2){
        const ph = bioPhase(mon), extra = {bioSplit:true, coursRoom:rooms[0], tpRoom:rooms[1], bioPh:ph};
        if(ph === 2 || ph === 3){ const g = ph === 2 ? "A" : "B";
          if(!t.ans.ab || t.ans.ab === g) out.push(Object.assign({}, l, extra, {room:rooms[1], tp:g, tags:Object.assign({}, l.tags, {bio:"TP"})})); }
        else out.push(Object.assign({}, l, extra, {room:rooms[0]}));
      } else out.push(l); });
    C.g.forEach(code => { const G = GROUPS[code], dimGroups = groupsOf(t.cls, G.dim), chosen = t.ans[G.dim];
      if(chosen && chosen !== code) return;
      G.L.forEach(s => { const l = parseL(s, {group:code, gdim:G.dim, gshow:!chosen && dimGroups.length > 1}); if(l) out.push(l); }); });
  }
  // an option spécifique that isn't in the class timetable replaces the class's option block
  const os = t.ans.os;
  if(os && !(C && C.g.includes(os))){
    if(GROUPS[os]) GROUPS[os].L.forEach(s => { const l = parseL(s, {group:os, gdim:"os"}); if(l) out.push(l); });
    else if(OSMAP[os]) osBlock(t.cls).forEach(([d, a, b]) => { const l = parseL(`${d} ${a}${b > a ? "-" + b : ""} ${OSMAP[os].long} (OS)`, {estimated:true}); if(l) out.push(l); });
  }
  // one letter for everything split in half-classes: English, language 2, biology TP, OS TP
  const want = k => k === "aben" || k === "abl2" || k === "tp" ? t.ans.ab : k === "bio" ? null : t.ans[k];
  out = out.filter(l => Object.entries(l.tags).every(([k, v]) => !want(k) || want(k) === v));
  if(t.oc) ocSlots(t.oc).forEach((s, i) => { if(t.ocSlots && !t.ocSlots.includes(i)) return; const l = parseL(s, {oc:true, estimated:!OC_SLOTS[t.oc]}); if(l) out.push(l); });
  out.forEach(l => { l.key = [l.day, l.p1, l.name, l.group || "", l.tags.abl2 || l.tags.aben || l.tags.tp || l.tags.bio || ""].join("|"); if(t.rooms[l.key] != null) l.room = t.rooms[l.key]; });
  out = out.filter(l => !t.hidden.includes(l.key));
  t.extra.forEach(x => out.push(Object.assign({}, x, {tags:{}, key:"x|" + x.id, extra:true})));
  return out.sort((a, b) => a.day - b.day || a.p1 - b.p1 || a.name.localeCompare(b.name));
}

/* ============ dates ============ */
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fromIso = x => { const [y, m, d] = x.split("-").map(Number); return new Date(y, m - 1, d); };
let MONTHS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const fmtD = d => d.getDate() + (LANG === "de" ? ". " : " ") + MONTHS[d.getMonth()];
const wdName = d => DAYNAMES[(d.getDay() + 6) % 7];
const dl = x => LANG === "fr" ? x.toLowerCase() : x;
function mondayOf(d){ d = new Date(d.getFullYear(), d.getMonth(), d.getDate()); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
const isWeekend = () => { const d = new Date().getDay(); return d === 0 || d === 6; };
const todayIso = () => iso(new Date());
function homeWeek(){ const w = mondayOf(new Date()); if(isWeekend()) w.setDate(w.getDate() + 7); return w; }
let sWeek = homeWeek();
let sDay = (() => { const d = new Date().getDay(); return d >= 1 && d <= 5 ? d - 1 : 0; })();
const dayDate = i => { const d = new Date(sWeek); d.setDate(d.getDate() + i); return d; };
const sDate = () => dayDate(sDay);
function daysUntil(x){ return Math.round((fromIso(x) - fromIso(todayIso())) / 86400000); }
function whenTxt(x){ const n = daysUntil(x), d = fromIso(x);
  if(n === 0) return tr("Aujourd'hui"); if(n === 1) return tr("Demain"); if(n === -1) return tr("Hier");
  if(n < 0) return fmtD(d); if(n < 7) return wdName(d) + " " + fmtD(d); return fmtD(d) + ", " + tr("dans " + n + " jours"); }

function countdownHTML(){

  if(cur) return `<div class="cdwrap"><span class="cdown">${tr(cur[2])} ${tr("jusqu'au")} ${fmtD(fromIso(cur[1]))}</span></div>`;
  const n = HOLIDAYS.find(h => h[0] > t); if(!n) return "";

  return `<div class="cdwrap"><span class="cdown">${tr(n[2])} ${tr(d === 1 ? "demain" : "dans " + d + " jours")}</span></div>`;

function dueTxt(x){ const n = daysUntil(x), d = fromIso(x);

function lessonTimeFor(sid, dateIso){

  return l ? [PERIODS[l.p1][0], PERIODS[l.p2][1]] : null;

function gcalUrl(x){
  const sb = sub(x.sid), tm = lessonTimeFor(x.sid, x.date), d = x.date.replace(/-/g, "");
  let dates;
  if(tm) dates = d + "T" + tm[0].replace(":", "") + "00/" + d + "T" + tm[1].replace(":", "") + "00";
  else { const e = fromIso(x.date); e.setDate(e.getDate() + 1); dates = d + "/" + iso(e).replace(/-/g, ""); }
  const title = evT(0, sb, x.name);

}
function exportIcs(){
  const e2 = t => String(t).replace(/[\\,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Matu//FR", "CALSCALE:GREGORIAN"]; let n = 0;
  const add = (uidv, date, title, tm) => { const d = date.replace(/-/g, ""); n++;
    L.push("BEGIN:VEVENT", "UID:" + uidv + "@gymnase", "DTSTAMP:" + stamp);
    if(tm) L.push("DTSTART:" + d + "T" + tm[0].replace(":", "") + "00", "DTEND:" + d + "T" + tm[1].replace(":", "") + "00");
    else { const e = fromIso(date); e.setDate(e.getDate() + 1); L.push("DTSTART;VALUE=DATE:" + d, "DTEND;VALUE=DATE:" + iso(e).replace(/-/g, "")); }
    L.push("SUMMARY:" + e2(title), "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + e2(title), "TRIGGER:-PT12H", "END:VALARM", "END:VEVENT"); };
  openTests().filter(x => x.date >= todayIso()).forEach(x => { const sb = sub(x.sid); add("t" + x.id, x.date, evT(0, sb, x.name), lessonTimeFor(x.sid, x.date)); });
  hws().filter(x => !x.done && x.due >= todayIso()).forEach(x => { const sb = sub(x.sid); add("h" + x.id, x.due, evT(1, sb, x.text), lessonTimeFor(x.sid, x.due)); });
  L.push("END:VCALENDAR");
  if(!n){ toast("Aucun test ni devoir à venir"); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([L.join("\r\n")], {type:"text/calendar"}));
  a.download = "matu-agenda.ics"; document.body.appendChild(a); a.click(); a.remove();
  toast(n + (n > 1 ? " événements exportés" : " événement exporté"));
}

function trendHTML(){

  const vals = pts.map(p => p.v), lo = Math.max(1, Math.floor(Math.min(...vals, 4) * 2) / 2 - 0.5), hi = Math.min(6, Math.ceil(Math.max(...vals) * 2) / 2 + 0.5);
  const W = 320, H = 100, P = 8, x = i => P + i * (W - 2 * P) / (pts.length - 1), y = v => H - P - (v - lo) / (hi - lo || 1) * (H - 2 * P);
  const last = pts[pts.length - 1].v;
  return `<div class="card trend"><div class="trhead"><span class="lab">Ta moyenne au fil de l'année</span><b class="${col(last)}">${f2(Math.round(last * 100) / 100)}</b></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${y(4)}" y2="${y(4)}" stroke="var(--faint)" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke"/>

let examOpen = false;
function exState(){
  if(!state.exams){
    state.exams = {};
    state.subjects.forEach(s => { if(!s.counts) return;
      const on = /^(Français|Allemand|Italien|Langue 2|Anglais|Mathématiques)$/.test(s.name) || Object.values(OSMAP).some(o => o.name === s.name) || s.name === "Option spécifique";
      state.exams[s.id] = {on, w:null, o:null}; });
  }
  state.subjects.forEach(s => { if(s.counts && !state.exams[s.id]) state.exams[s.id] = {on:false, w:null, o:null}; });
  return state.exams;
}
function examFinal(s){
  const e = exState()[s.id], a = final(s);
  if(!e || !e.on || a == null) return a;
  const marks = [e.w, e.o].filter(v => v != null);
  if(!marks.length) return a;
  return half(marks.length === 2 ? (2 * a + e.w + e.o) / 4 : (a + marks[0]) / 2);

  const step = (sid, k, v, label) => `<div class="mstep"><small>${label}</small><div class="mrowx"><button data-x="dn" data-id="${sid}" data-k="${k}" aria-label="Moins">−</button><b data-x="clr" data-id="${sid}" data-k="${k}" class="${v == null ? "empty" : col(v)}">${v == null ? "–" : f2(v)}</b><button data-x="up" data-id="${sid}" data-k="${k}" aria-label="Plus">+</button></div></div>`;
  let h = `<div class="shead"><button class="icon" data-x="back" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><h1>Examens</h1></div>

  if(o){
    const diff = r(o.total - o.need), ok = diff >= 0 && o.under.length <= 4, exOk = examAvg == null || examAvg >= 3.5;
    h += `<section class="card hero"><div class="lab">Total avec ces examens</div><div class="big ${ok ? (diff >= o.n * 0.5 ? "c-green" : "") : "c-red"}">${f2(r(o.total))}</div>
      <div class="break">${diff >= 0 ? `<b class="c-green">+${f2(diff)}</b> au-dessus du minimum de ${o.need}` : `<b class="c-red">Il manque ${f2(-diff)}</b> pour le minimum de ${o.need}`}</div>
      <div class="checks"><div class="${diff >= 0 ? "c-green" : "c-red"}">${diff >= 0 ? "✓" : "✗"} Au moins ${o.need} points</div>

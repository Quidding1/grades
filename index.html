  if($("lsAddHw")) $("lsAddHw").onclick = () => { closeSheet(); setTimeout(() => hwSheet(null, {sid:ls.id, due:nextLessonDate(ls.id, iso(dayDate(l.day)))}), 260); };
  $("roomSave").onclick = () => { const t = tt(), v = $("roomIn").value.trim();
    if(l.extra){ const x = t.extra.find(x => "x|" + x.id === key); if(x) x.room = v; } else t.rooms[key] = v;
    save(); closeSheet(); renderSched(); toast("Enregistré"); };
  $("hideL").onclick = () => { const t = tt();
    if(l.extra){ t.extra = t.extra.filter(x => "x|" + x.id !== key); save(); closeSheet(); renderSched(); toast("Cours supprimé"); return; }
    t.hidden.push(key); save(); closeSheet(); renderSched();
    toast("Cours masqué", {label:"Annuler", fn:() => { t.hidden = t.hidden.filter(k => k !== key); save(); renderSched(); }}); };
}
function addLessonSheet(){
  const d = {day:sDay, p1:1, len:1};
  openSheet(`<h3>Ajouter un cours</h3>
    <span class="lab2">Nom</span><input class="inp" id="alName" placeholder="p. ex. Appui de maths">
    <span class="lab2">Jour</span><div class="chips" id="alDay">${DAYS_FR.map((x, i) => `<button class="chip" data-v="${i}" aria-pressed="${i === d.day}">${x}</button>`).join("")}</div>
    <span class="lab2">Début</span><div class="chips" id="alP">${Object.keys(PERIODS).map(p => `<button class="chip" data-v="${p}" aria-pressed="${+p === d.p1}">${PERIODS[p][0]}</button>`).join("")}</div>
    <span class="lab2">Durée</span><div class="chips" id="alLen">${[1,2,3,4].map(n => `<button class="chip" data-v="${n}" aria-pressed="${n === d.len}">${n} ${n > 1 ? "périodes" : "période"}</button>`).join("")}</div>
    <span class="lab2">Salle (facultatif)</span><input class="inp" id="alRoom" placeholder="p. ex. S1.06">
    <button class="primary" id="alSave">Ajouter le cours</button>`);
  const pick = (id, k) => $(id).onclick = e => { const c = e.target.closest(".chip"); if(!c) return; d[k] = +c.dataset.v; $(id).querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c)); };
  pick("alDay", "day"); pick("alP", "p1"); pick("alLen", "len");
  $("alSave").onclick = () => { const n = $("alName").value.trim(); if(!n){ toast("Donne un nom au cours"); return; }
    tt().extra.push({id:uid(), day:d.day, p1:d.p1, p2:Math.min(10, d.p1 + d.len - 1), name:n, room:$("alRoom").value.trim()});
    save(); closeSheet(); sDay = d.day; renderSched(); toast("Cours ajouté"); };
}

/* ============ onboarding ============ */
let obStep = null, obHist = [], lockCommit = null;
function obSteps(){
  const t = tt(), s = ["intro", "welcome", "class"];
  if(t.cls){
    if(groupsOf(t.cls, "math").length > 1) s.push("math");
    if(groupsOf(t.cls, "hist").length > 1) s.push("hist");
    if(groupsOf(t.cls, "l2").length > 1) s.push("l2");
  }
  s.push("os");
  if(t.cls && hasAB()) s.push("ab");
  s.push("locked", "oc");
  if(t.oc && OC_SLOTS[t.oc] && OC_SLOTS[t.oc].length > 1) s.push("ocslots");
  s.push("done");
  return s;
}
// does this class (or its option) split in half-classes A / B?
function hasAB(){
  const t = tt(), C = CLASSES[t.cls], os = effOS(); if(!C) return false;
  return C.L.some(x => /#ab(l2|en)=/.test(x) || /^\S+ \S+ Biologie @[^,#]+,/.test(x)) || groupsOf(t.cls, "l2").length > 0 || !!(GROUPS[os] && GROUPS[os].L.some(x => x.includes("#tp=")));
}
function openOnboarding(start){ obHist = []; obStep = start || "intro"; $("ob").classList.add("on"); drawOb(0); }
function closeOb(){ $("ob").classList.remove("on"); state.onboarded = true; state.ob = null; save(); showTab(tab, false); }
function obNext(){ const s = obSteps(), i = s.indexOf(obStep); obHist.push(obStep); obStep = s[Math.min(s.length - 1, i + 1)]; drawOb(1); }
function obBack(){ if(!obHist.length){ closeOb(); return; } obStep = obHist.pop(); drawOb(-1); }
const opt = (v, label, hint, on) => `<button class="opt" data-o="${esc(v)}" aria-pressed="${!!on}"><b>${esc(label)}</b>${hint ? `<span>${esc(hint)}</span>` : ""}</button>`;
function slotText(s){ const l = parseL(s); return `${DAYNAMES[l.day]}, de ${PERIODS[l.p1][0]} à ${PERIODS[l.p2][1]}${l.room ? ", " + l.room : ""}`; }
function drawOb(dir){
  const t = tt(), s = obSteps(), i = Math.max(0, s.indexOf(obStep));
  $("obProg").style.width = (i / (s.length - 1) * 100) + "%";
  $("obBack").style.visibility = obStep === "intro" ? "hidden" : "visible";
  let h = "", skip = true;
  switch(obStep){
    case "intro": skip = false;
      h = `<div class="obhero">🎓</div><h2>Bienvenue sur Matu</h2><p>Une app pour les élèves du gymnase, de la 3M01 à la 3M14. Tout ce qu'il te faut au quotidien, au même endroit.</p>
        <div class="list" style="margin:0 0 18px">
          <div class="row" style="cursor:default"><div class="rname"><b>📅 Horaire</b><span class="muted">Ta semaine avec les vraies dates, les vacances vaudoises et le prochain cours.</span></div></div>
          <div class="row" style="cursor:default"><div class="rname"><b>✅ Agenda</b><span class="muted">Tes tests (TE) et devoirs (DV), avec export vers Google Agenda.</span></div></div>
          <div class="row" style="cursor:default"><div class="rname"><b>📊 Notes</b><span class="muted">Tes moyennes, la compensation de la maturité vaudoise et un simulateur d'examens.</span></div></div>
        </div>
        <p class="muted">Tes données restent sur ton téléphone. L'app ne demande aucun compte.</p>
        <button class="primary" data-o="start">Suivant</button>`; break;
    case "welcome": skip = false;
      h = `<div class="obhero">📅</div><h2>Configure ton année</h2><p>Choisis ta classe et tes options une seule fois. Ton horaire et tes 14 notes de maturité se mettent en place tout seuls.</p><p class="muted">Tu peux passer chaque question. Une question passée affiche tous les groupes, et tout se modifie plus tard dans les réglages.</p>
        <button class="primary" data-o="start">Commencer</button><button class="textlink" data-o="skipall">Passer la configuration</button>`; break;
    case "class":
      h = `<h2>Dans quelle classe es-tu ?</h2><p>Le code de ta classe sur Hermes, par exemple 3M09.</p><div class="grid3">${Object.keys(CLASSES).map(c => `<button class="opt sm" data-o="${c}" aria-pressed="${t.cls === c}"><b>${c}</b></button>`).join("")}</div>`; break;
    case "math":
      h = `<h2>Ton groupe de maths</h2><p>Regarde sur Hermes si tu n'es pas sûr·e.</p>${groupsOf(t.cls, "math").map(g => opt(g, GROUPS[g].label, g, t.ans.math === g)).join("")}`; break;
    case "hist":
      h = `<h2>Ton groupe d'histoire</h2><p>Certaines classes ont deux groupes d'histoire.</p>${groupsOf(t.cls, "hist").map(g => opt(g, GROUPS[g].label, g, t.ans.hist === g)).join("")}`; break;
    case "l2":
      h = `<h2>Ta langue 2</h2><p>Allemand ou italien, et ton groupe.</p>${groupsOf(t.cls, "l2").map(g => opt(g, GROUPS[g].label, g, t.ans.l2 === g)).join("")}`; break;
    case "ab":
      h = `<h2>Ton groupe : A ou B ?</h2><p>Ta classe se divise en deux pour l'anglais, l'allemand ou l'italien, et les TP de biologie. Tu es dans le même groupe pour tous ces cours.</p>${opt("A", "Groupe A", "Anglais, langue 2 et TP en groupe A", t.ans.ab === "A")}${opt("B", "Groupe B", "Anglais, langue 2 et TP en groupe B", t.ans.ab === "B")}`; break;
    case "os": { const cg = groupsOf(t.cls, "os");
      const others = OS_ORDER.flatMap(k => { const gs = Object.keys(GROUPS).filter(g => GROUPS[g].dim === "os" && g.replace(/\d+$/, "") === k && !cg.includes(g));
        return gs.length ? gs.map(g => opt(g, GROUPS[g].label, "Groupe " + g, t.ans.os === g)) : [opt(k, OSMAP[k].long, "", t.ans.os === k)]; });
      h = `<h2>Ton option spécifique</h2><p>La branche choisie en 1re année.</p>${cg.length ? `<span class="lab2" style="margin-top:0">Dans ta classe</span>` : ""}${cg.map(g => opt(g, GROUPS[g].label, "Groupe " + g, t.ans.os === g)).join("")}<span class="lab2">${cg.length ? "Autres options" : "Toutes les options"}</span>${others.join("")}`; break; }
    case "locked":
      h = `<h2>Tes notes bloquées de 2e année</h2><p>Combien de points en plus ou en moins tes notes de chimie, physique et arts te donnent ? Chaque note compte par rapport à 4.</p>
        ${lockedFields()}<button class="primary" data-o="lpok">Continuer</button>`; break;
    case "oc": { const os = osOf(effOS()), hide = os ? os.noOC : [];
      h = `<h2>Ton option complémentaire</h2><p>Ton option de 3e année, le jeudi après-midi.</p>${OC_LIST.filter(o => !hide.includes(o)).map(o => opt(o, o, ocWhen(o), t.oc === o)).join("")}`; break; }
    case "ocslots": { const sl = OC_SLOTS[t.oc], sel = t.ocSlots || [];
      h = `<h2>Quels cours de ${esc(t.oc.toLowerCase())} sont les tiens ?</h2><p>Cette option a plusieurs blocs. Coche les tiens.</p>${sl.map((x, k) => `<button class="opt multi" data-m="${k}" aria-pressed="${sel.includes(k)}"><b>${esc(slotText(x))}</b></button>`).join("")}<button class="primary" data-o="slotsok">Continuer</button>`; break; }
    case "done": { skip = false;
      const hasGrades = state.subjects.some(x => x.grades.length) || state.tm.g != null;
      const rows = [["Classe", t.cls], ["Maths", t.ans.math], ["Histoire", t.ans.hist], ["Langue 2", t.ans.l2 ? GROUPS[t.ans.l2].label + " " + t.ans.l2 : null], ["Option spécifique", effOS() ? osLabel(effOS()) : null], ["Groupe A/B", t.ans.ab], ["Notes de 2e année", state.lockedPoints != null ? bonusTxt(state.lockedPoints - 12) + (Math.abs(state.lockedPoints - 12) > 1 ? " points" : " point") : null], ["Option complémentaire", t.oc]];
      h = `<h2>C'est prêt</h2><div class="list" style="margin:6px 0 16px">${rows.map(([k, v]) => `<div class="row" style="cursor:default"><div class="rname"><b>${k}</b></div><span class="${v ? "" : "muted"}">${v ? esc(v) : "Tous / plus tard"}</span></div>`).join("")}</div>
        ${hasGrades ? `<p>Tu as déjà des notes. Mettre à jour tes branches selon ces réponses ? Tes notes sont gardées.</p><button class="primary" data-o="apply">Mettre à jour et terminer</button><button class="secondary" data-o="finish">Garder mes branches</button>`
                    : `<button class="primary" data-o="apply">Terminer</button>`}`; break; }
  }
  if(skip) h += `<button class="textlink" data-o="skip">Passer, je le ferai plus tard</button>`;
  const el = $("obSlide"); el.innerHTML = h; el.scrollTop = 0;
  state.ob = {step:obStep, hist:obHist}; save();
  lockCommit = obStep === "locked" ? bindLocked() : null;
  if(dir && el.animate && !matchMedia("(prefers-reduced-motion: reduce)").matches)
    el.animate([{transform:`translateX(${dir * 50}px)`, opacity:0}, {transform:"none", opacity:1}], {duration:260, easing:"cubic-bezier(.2,.8,.2,1)"});
}
$("obBack").onclick = obBack;
$("obSlide").addEventListener("click", e => {
  const t = tt(), m = e.target.closest("[data-m]");
  if(m){ const k = +m.dataset.m, sel = new Set(t.ocSlots || []); sel.has(k) ? sel.delete(k) : sel.add(k); t.ocSlots = [...sel].sort(); m.setAttribute("aria-pressed", sel.has(k)); return; }
  const b = e.target.closest("[data-o]"); if(!b) return;
  const v = b.dataset.o;
  if(v === "start") return obNext();
  if(v === "skipall"){ closeOb(); if(!state.tutDone) setTimeout(startTutorial, 400); return; }
  if(v === "apply"){ applyGrades(); closeOb(); showTab(t.cls ? "sched" : "grades", true); if(!state.tutDone) setTimeout(startTutorial, 500); else toast("Ton année est configurée"); return; }
  if(v === "finish"){ closeOb(); showTab(t.cls ? "sched" : "grades", true); if(!state.tutDone) setTimeout(startTutorial, 500); return; }
  if(v === "lpok"){ if(lockCommit && lockCommit()) obNext(); return; }
  if(v === "slotsok"){ if(t.ocSlots && !t.ocSlots.length) t.ocSlots = null; save(); return obNext(); }
  if(v === "skip"){
    if(obStep === "class"){ t.cls = null; t.ans = {}; }
    else if(obStep === "locked") state.lockedPoints = null;
    else if(obStep === "oc"){ t.oc = null; t.ocSlots = null; }
    else if(obStep === "ocslots") t.ocSlots = null;
    else delete t.ans[obStep];
    save(); return obNext();
  }
  b.parentElement.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", x === b));
  if(obStep === "class"){ if(t.cls !== v){ t.ans = {}; t.hidden = []; t.rooms = {}; } t.cls = v; }

  else if(obStep === "oc"){ if(t.oc !== v) t.ocSlots = null; t.oc = v; }
  else { t.ans[obStep] = v; if(obStep === "os" && !GROUPS[v]) delete t.ans.tp; }
  save(); setTimeout(obNext, 160);
});

/* ============ answers -> grade subjects ============ */
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]/g, "");
function applyGrades(){
  const t = tt(), C = CLASSES[t.cls];
  let l2 = t.ans.l2 ? GROUPS[t.ans.l2].label : null;
  if(!l2 && C && !groupsOf(t.cls, "l2").length) l2 = "Allemand";
  const osG = effOS(), os = osOf(osG);
  const want = [
    {name:"Français"}, {name:l2 || "Langue 2"}, {name:"Anglais"}, {name:"Mathématiques"}, {name:"Biologie"}, {name:"Histoire"}, {name:"Géographie"}, {name:"Philosophie"},
    os ? {name:os.name, parts:os.parts} : {name:"Option spécifique"},
    {name:t.oc ? "OC " + t.oc : "Option complémentaire"}
  ];
  const old = [...state.subjects], used = new Set();
  const subjects = want.map(w => {
    const m = old.find(o => !used.has(o) && norm(o.name) === norm(w.name)); 
    if(m){ used.add(m); m.counts = true; if(w.parts && !m.parts) m.parts = w.parts.map(p => ({...p})); return m; }
    return Object.assign({id:uid(), name:w.name, counts:true, grades:[]}, w.parts ? {parts:w.parts.map(p => ({...p}))} : {});
  });
  old.forEach(o => { if(!used.has(o) && o.grades.length){ o.counts = false; subjects.push(o); } });
  state.subjects = subjects; dedupe(state); save();
}

/* ============ offline ============ */
function netState(){ $("offbar").classList.toggle("on", navigator.onLine === false); }
function offlineSheet(){
  openSheet(`<div class="offhero"><svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M8.5 16.4a5 5 0 0 1 6-.8M5 12.9a10 10 0 0 1 4.2-2.5M19 12.9a10 10 0 0 0-3-2M2 9.3a15 15 0 0 1 4-2.6M22 9.3a15 15 0 0 0-11.5-4.2"/><path d="M12 20h.01"/></svg></div><h3 style="text-align:center">Pas de connexion</h3>
    <p class="note" style="text-align:center;margin:0 0 4px">Ton téléphone n'est pas connecté à internet.</p>
    <div class="list" style="margin-top:14px"><div class="row" style="cursor:default"><div class="rname"><b>Ce qui marche</b><span>Horaire, agenda et notes : tout est enregistré sur ton téléphone.</span></div></div>
    <div class="row" style="cursor:default"><div class="rname"><b>Ce qui attend la connexion</b><span>Google Agenda et les mises à jour de l'app.</span></div></div></div>
    <button class="primary" id="offOk">OK</button>`);
  $("offOk").onclick = closeSheet;
}
$("offbar").onclick = offlineSheet;
addEventListener("offline", netState);
addEventListener("online", () => { netState(); toast("De nouveau en ligne"); });
netState();

applyLang(true);
applyTheme();
showTab(tab, false);
if(state.ob && state.ob.step){
  // the app was closed in the middle of the setup: continue where it stopped
  obHist = (state.ob.hist || []).filter(x => obSteps().includes(x));
  obStep = obSteps().includes(state.ob.step) ? state.ob.step : "intro";
  $("ob").classList.add("on"); drawOb(0);
} else if(!state.onboarded) openOnboarding();
else if(!state.tutDone) setTimeout(startTutorial, 700);
if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
